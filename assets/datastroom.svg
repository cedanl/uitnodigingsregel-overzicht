<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="titel beschrijving"><title id="titel">Van data tot gesprek</title><desc id="beschrijving">Toolkit: Voorbereiden, Uitvoeren, Evalueren en opschalen. Eigen gegevens naar Rekenen. Rekenen naar Ranglijst. Ranglijst naar Gesprek. Rekenen naar Werkt het hier?. Werkt het hier? naar Gezamenlijk overzicht (optioneel).</desc><defs><clipPath id="kader"><rect width="1200" height="640" rx="18"/></clipPath><marker id="pijl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1200" height="640" rx="18" fill="#FFFFFF"/><g clip-path="url(#kader)" fill="none" stroke-width="5"><circle cx="1150" cy="40" r="120" stroke="#DD784B" opacity="0.9"/><circle cx="1150" cy="40" r="95" stroke="#3D68EC" opacity="0.9"/><circle cx="1150" cy="40" r="70" stroke="#00AF81" opacity="0.9"/><circle cx="1150" cy="40" r="45" stroke="#F4D74B" opacity="0.9"/></g><text x="40" y="62" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="600" font-style="normal" fill="#DD784B" text-anchor="start">Van data tot gesprek</text><text x="40" y="96" font-family="'Cooper Light BT', Georgia, serif" font-size="18" font-weight="400" font-style="italic" fill="#000000" text-anchor="start">Gegevens die de instelling al heeft, worden een uitnodiging voor een gesprek.</text><rect x="30" y="150" width="1140" height="52" rx="14" fill="#FAEAEA"/><text x="52" y="180.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" font-style="normal" fill="#6B7280" text-anchor="start">TOOLKIT</text><rect x="150" y="160.0" width="152" height="32" rx="16" fill="#3D68EC"/><text x="226.0" y="181.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600" font-style="normal" fill="#F4D74B" text-anchor="middle">Voorbereiden</text><path d="M312,176.0 L346,176.0" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" marker-end="url(#pijl)"/><rect x="362" y="160.0" width="125" height="32" rx="16" fill="#3D68EC"/><text x="424.5" y="181.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600" font-style="normal" fill="#F4D74B" text-anchor="middle">Uitvoeren</text><path d="M497,176.0 L531,176.0" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" marker-end="url(#pijl)"/><rect x="547" y="160.0" width="242" height="32" rx="16" fill="#3D68EC"/><text x="668.0" y="181.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600" font-style="normal" fill="#F4D74B" text-anchor="middle">Evalueren en opschalen</text><text x="1148" y="180.0" font-family="'Cooper Light BT', Georgia, serif" font-size="13" font-weight="400" font-style="italic" fill="#000000" text-anchor="end">documenten per fase</text><path d="M283.0,302.0 L331.0,302.0" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pijl)"/><path d="M573.0,302.0 L621.0,302.0" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pijl)"/><path d="M863.0,302.0 L911.0,302.0" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pijl)"/><path d="M455,354 C455,462.0 495,462.0 621.0,462.0" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pijl)"/><path d="M863.0,462.0 L911.0,462.0" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#pijl)"/><rect x="47.0" y="250" width="236" height="104" rx="12" fill="#F4D9DC" stroke="#000000" stroke-width="1.6"/><text x="165" y="280.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#000000" text-anchor="middle">Eigen gegevens</text><text x="165" y="298.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">aanmelding, vooropleiding,</text><text x="165" y="316.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">verzuim, demografie</text><text x="165" y="334.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#3D68EC" text-anchor="middle">eerdere en huidig cohort</text><rect x="337.0" y="250" width="236" height="104" rx="12" fill="#DD784B" stroke="#000000" stroke-width="1.6"/><text x="455" y="280.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#000000" text-anchor="middle">Rekenen</text><text x="455" y="298.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">voorbereiden, rangschikken,</text><text x="455" y="316.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">kwaliteit meten</text><text x="455" y="334.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">met student-signal</text><rect x="627.0" y="250" width="236" height="104" rx="40" fill="#00AF81" stroke="#000000" stroke-width="1.6"/><text x="745" y="280.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" fill="#000000" text-anchor="middle">Ranglijst</text><text x="745" y="298.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">studenten op volgorde</tex