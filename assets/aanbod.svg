<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="titel beschrijving"><title id="titel">Wat er inmiddels ligt</title><desc id="beschrijving">Een instelling die wil beginnen, begint niet bij nul. Methode: Uit promotieonderzoek. Wetenschappelijk gerepliceerd bij zes instellingen en gepubliceerd. Pilots: Praktijkpilots bij mbo-instellingen met echte data en een vaste effectmeting. Toolkit en e-learning: Draagvlak, spelregels, het ethische gesprek en evaluatie. Plus een e-learningmodule. Juridisch: Eén sectorbrede DPIA voor de Uitnodigingsregel. App: Installeren met één commando. Draait bij de instelling, de gegevens blijven binnen. Ondersteuning: Informatiesessie, hulp bij de data en twee dagen op locatie met een data scientist. Beginnen is geen bouwtraject meer, maar installeren en draaien.</desc><defs><clipPath id="kader"><rect width="1200" height="640" rx="18"/></clipPath></defs><rect width="1200" height="640" rx="18" fill="#FFFFFF"/><g clip-path="url(#kader)" fill="none" stroke-width="5"><circle cx="1150" cy="40" r="120" stroke="#DD784B" opacity="0.9"/><circle cx="1150" cy="40" r="95" stroke="#3D68EC" opacity="0.9"/><circle cx="1150" cy="40" r="70" stroke="#00AF81" opacity="0.9"/><circle cx="1150" cy="40" r="45" stroke="#F4D74B" opacity="0.9"/></g><text x="40" y="62" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="30" font-weight="600" font-style="normal" fill="#DD784B" text-anchor="start">Wat er inmiddels ligt</text><text x="40" y="96" font-family="'Cooper Light BT', Georgia, serif" font-size="18" font-weight="400" font-style="italic" fill="#000000" text-anchor="start">Een instelling die wil beginnen, begint niet bij nul.</text><rect x="40" y="140" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><rect x="41" y="154" width="7" height="128" rx="3.5" fill="#3D68EC"/><rect x="64" y="160" width="88.19999999999999" height="30" rx="15" fill="#3D68EC"/><text x="108.1" y="180" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600" font-style="normal" fill="#F4D74B" text-anchor="middle">Methode</text><text x="66" y="222" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">Uit promotieonderzoek.</text><text x="66" y="244" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">Wetenschappelijk gerepliceerd bij</text><text x="66" y="266" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">zes instellingen en gepubliceerd.</text><rect x="420" y="140" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><rect x="421" y="154" width="7" height="128" rx="3.5" fill="#DD784B"/><rect x="444" y="160" width="79.6" height="30" rx="15" fill="#DD784B"/><text x="483.8" y="180" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600" font-style="normal" fill="#000000" text-anchor="middle">Pilots</text><text x="446" y="222" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">Praktijkpilots bij mbo-instellingen</text><text x="446" y="244" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">met echte data en een vaste</text><text x="446" y="266" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">effectmeting.</text><rect x="800" y="140" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><rect x="801" y="154" width="7" height="128" rx="3.5" fill="#00AF81"/><rect x="824" y="160" width="208.6" height="30" rx="15" fill="#00AF81"/><text x="928.3" y="180" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600" font-style="normal" fill="#000000" text-anchor="middle">Toolkit en e-learning</text><text x="826" y="222" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">Draagvlak, spelregels, het</text><text x="826" y="244" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">ethische gesprek en evaluatie.</text><text x="826" y="266" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">Plus een e-learningmodule.</text><rect x="40" y="320" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><rect x="41" y="334" width="7" height="128" rx="3.5" fill="#F4D9DC"/><rect x="64" y="340" width="105.39999999999999" height="30" rx="15" fill="#F4D9DC"/><text x="116.69999999999999" y="360" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600" font-style="normal" fill="#000000" text-anchor="middle">Juridisch</text><text x="66" y="402" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">Eén sectorbrede DPIA</text><text x="66" y="424" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">voor de Uitnodigingsregel.</text><rect x="420" y="320" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><rect x="421" y="334" width="7" height="128" rx="3.5" fill="#F4D74B"/><rect x="444" y="340" width="53.8" height="30" rx="15" fill="#F4D74B"/><text x="470.9" y="360" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600" font-style="normal" fill="#000000" text-anchor="middle">App</text><text x="446" y="402" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">Installeren met één commando.</text><text x="446" y="424" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">Draait bij de instelling, de</text><text x="446" y="446" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">gegevens blijven binnen.</text><rect x="800" y="320" width="360" height="156" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/><rect x="801" y="334" width="7" height="128" rx="3.5" fill="#3D68EC"/><rect x="824" y="340" width="139.8" height="30" rx="15" fill="#3D68EC"/><text x="893.9" y="360" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600" font-style="normal" fill="#F4D74B" text-anchor="middle">Ondersteuning</text><text x="826" y="402" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">Informatiesessie, hulp bij de</text><text x="826" y="424" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">data en twee dagen op locatie</text><text x="826" y="446" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="start">met een data scientist.</text><rect x="40" y="500" width="1120" height="56" rx="14" fill="#FAEAEA"/><text x="600.0" y="534.0" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" fill="#000000" text-anchor="middle">Beginnen is geen bouwtraject meer, maar installeren en draaien.</text><text x="40" y="612" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="start">CEDA · Npuls · stand november 2026</text><text x="1160" y="612" font-family="'General Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" fill="#000000" text-anchor="end">Onderwijs bewegen.</text></svg>
